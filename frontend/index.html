<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SO2 Upgrader</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a0f;color:#eef7fb;font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;padding-bottom:78px}.top{height:70px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;border-bottom:1px solid #1c2835;position:sticky;top:0;background:#080c12ee;z-index:3}.logo{font-weight:900;font-size:21px}.logo i{color:#12d9ff;font-style:normal}.bal{color:#12d9ff;background:#101923;border:1px solid #213344;padding:10px;border-radius:11px}.hero{padding:28px 20px}.hero small,.title{color:#718091;font-size:10px;letter-spacing:2px;font-weight:800}.hero h1{font-size:38px;line-height:1;margin:8px 0}.hero h1 span{color:#12d9ff}.panel{padding:10px 18px 18px}.cards{display:flex;gap:10px;overflow:auto}.card{min-width:140px;background:#0d151e;border:1px solid #1c2835;border-radius:14px;padding:9px}.card.sel{border-color:#12d9ff}.card img{width:100%;height:105px;object-fit:contain;background:#080d13;border-radius:9px}.name{font-size:11px;font-weight:800;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:10px;color:#12d9ff;margin-top:4px}.rar{font-size:8px;color:#718091;margin-top:3px}.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.case{background:#0d151e;border:1px solid #213343;border-radius:14px;padding:14px}.case em{font-style:normal;font-size:30px}.case b{display:block;font-size:12px;margin-top:7px}.case small{color:#12d9ff}.case button,.upgrade button,.modal button{width:100%;margin-top:9px;border:0;border-radius:10px;padding:11px;background:linear-gradient(90deg,#087bff,#12d9ff);font-weight:900;color:#001017}.upgrade{margin:8px 18px 18px;padding:15px;background:#0d151e;border:1px solid #203243;border-radius:16px}.ring{text-align:center;color:#12d9ff;font-weight:900;font-size:22px}.history div{padding:10px;border:1px solid #1c2835;border-radius:9px;margin-top:6px;font-size:10px}.ok{color:#35e29a}.bad{color:#ff526f}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:68px;background:#080c12f7;border-top:1px solid #1c2835;display:flex;justify-content:space-around;z-index:5}.nav button{background:none;border:0;color:#718091;font-size:15px}.nav .on{color:#12d9ff}.nav small{display:block;font-size:8px;margin-top:4px}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cat{background:#0d151e;border:1px solid #1c2835;border-radius:10px;padding:7px}.cat img{width:100%;height:75px;object-fit:contain;background:#080d13}.cat .name{font-size:9px}.search{width:100%;padding:11px;border-radius:10px;border:1px solid #1c2835;background:#091019;color:#fff;margin:10px 0}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:18px;z-index:10}.modal>div{width:min(360px,100%);background:#0d151e;border:1px solid #243849;border-radius:18px;padding:24px;text-align:center}.reel{display:flex;gap:8px;overflow:hidden;height:145px;align-items:center}.ri{flex:0 0 115px;height:125px;background:#101923;border:1px solid #1d2b39;border-radius:10px;text-align:center;padding:6px}.ri img{width:100%;height:83px;object-fit:contain}.ri b{font-size:8px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.openbox{position:fixed;inset:0;background:#02060bf5;display:grid;place-items:center;z-index:9}.openbox>div{width:min(760px,100%);padding:18px}.line{height:2px;background:#12d9ff;position:relative;z-index:2}.spin{transform:translateX(0)}@media(max-width:480px){.hero h1{font-size:33px}.catalog{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><header class="top"><div class="logo">SO2<i>UP</i></div><div class="bal">◆ <b id="bal">0.00</b></div></header><main id="up"><section class="hero"><small>TELEGRAM MINI APP</small><h1>Upgrade your<br><span>collection.</span></h1></section><section class="panel"><div class="title">🎁 CASES</div><div id="cases" class="cases"></div></section><section class="panel"><div class="title">ТВОЙ ПРЕДМЕТ</div><div id="inv" class="cards"></div></section><section class="panel"><div class="title">ЦЕЛЬ</div><div id="targets" class="cards"></div></section><section class="upgrade"><div class="ring" id="chance">0%</div><div id="utxt">Выбери предмет и цель</div><button id="ub" disabled>UPGRADE</button></section><section class="panel"><div class="title">ПОСЛЕДНИЕ ПОПЫТКИ</div><div id="hist" class="history"></div></section></main><main id="catpage" class="hidden"><section class="panel"><div class="title">📚 КАТАЛОГ</div><div id="ccount" class="muted">Загрузка...</div><input id="q" class="search" placeholder="Поиск предмета"><div id="catalog" class="catalog"></div></section></main></div>
<nav class="nav"><button id="nup" class="on">⬆<small>Upgrade</small></button><button id="ncat">📚<small>Catalog</small></button><button>🎒<small>Inventory</small></button><button>👤<small>Profile</small></button></nav>
<div id="open" class="openbox hidden"><div><div class="title" style="text-align:center">ОТКРЫТИЕ КЕЙСА</div><div class="reel" id="reel"></div><div class="line"></div><p id="st" style="text-align:center;color:#718091">Открываем...</p></div></div>
<div id="mod" class="modal hidden"><div><div id="icon" style="font-size:44px">🎁</div><h2 id="mt">RESULT</h2><p id="mx"></p><button onclick="mod.classList.add('hidden')">CONTINUE</button></div></div>
<script>
const API=window.SO2_API||"";let S,from=null,to=null;
const $=x=>document.getElementById(x);
async function load(){S=await fetch(API+"/api/state?user_id=1").then(r=>r.json());render();await cases();}
function c(s,sel,fn){return '<div class="card '+(sel?'sel':'')+'" onclick="'+fn+'"><img src="'+s.image+'"><div class="name">'+s.name+'</div><div class="price">◆ '+s.price+'</div><div class="rar">'+s.rarity+'</div></div>'}
function render(){$("bal").textContent=Number(S.user.balance).toFixed(2);$("inv").innerHTML=S.inventory.map(s=>c(s,from?.id===s.id,"pick("+s.id+")")).join("");$("targets").innerHTML=S.skins.filter(s=>!from||s.price>from.price).map(s=>c(s,to?.id===s.id,"target("+s.id+")")).join("");if(from&&to){let p=Math.min(.95,from.price/to.price)*100;$("chance").textContent=p.toFixed(1)+"%";$("utxt").textContent=from.name+" → "+to.name;$("ub").disabled=false}else{$("chance").textContent="0%";$("utxt").textContent="Выбери предмет и цель";$("ub").disabled=true}$("hist").innerHTML=S.history.map(h=>'<div>'+h.an+' → '+h.bn+' <b class="'+(h.ok?'ok':'bad')+'">'+(h.ok?'SUCCESS':'FAIL')+'</b></div>').join("")||'<div>Пока нет попыток.</div>'}
window.pick=id=>{from=S.inventory.find(x=>x.id===id);to=null;render()};window.target=id=>{to=S.skins.find(x=>x.id===id);render()};
async function cases(){let d=await fetch(API+"/api/cases?user_id=1").then(r=>r.json());let ico={daily:"🎁",starter:"📦",neon:"💠",premium:"🔥"};$("cases").innerHTML=Object.values(d.cases).map(x=>'<div class="case"><em>'+(ico[x.id]||"📦")+'</em><b>'+x.name+'</b><small>MAX DROP: '+x.max+' GOLD</small><button onclick="openCase(\''+x.id+'\')">'+(x.cost?'◆ '+x.cost:'FREE')+'</button></div>').join("")}
$("ub").onclick=async()=>{let d=await fetch(API+"/api/upgrade",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:1,from_skin_id:from.id,to_skin_id:to.id})}).then(r=>r.json());$("icon").textContent=d.success?"✦":"×";$("mt").textContent=d.success?"UPGRADE SUCCESS":"UPGRADE FAILED";$("mx").textContent=d.success?"Ты получил "+d.to.name:"Попытка не удалась. Шанс: "+d.chance+"%";$("mod").classList.remove("hidden");from=to=null;await load()};
window.openCase=async id=>{let d=await fetch(API+"/api/case/open",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:1,case_id:id})}).then(r=>r.json());if(d.detail){alert(d.detail);return}let pool=Array.from({length:25},()=>S.skins[Math.floor(Math.random()*S.skins.length)]);pool[20]=d.reward;$("reel").innerHTML=pool.map(s=>'<div class="ri"><img src="'+s.image+'"><b>'+s.name+'</b></div>').join("");$("open").classList.remove("hidden");$("st").textContent="Открываем...";let target=20*123-$("reel").clientWidth/2+61;requestAnimationFrame(()=>{$("reel").style.transition="transform 4.5s cubic-bezier(.08,.82,.12,1)";$("reel").style.transform="translateX(-"+target+"px)"});setTimeout(async()=>{ $("st").textContent="Награда получена!";setTimeout(()=>{$("open").classList.add("hidden")},700);$("icon").textContent=d.reward_gold?"💰":"🎁";$("mt").textContent="CASE OPENED";$("mx").textContent=d.reward_gold?("Ты получил +"+Number(d.reward_gold).toFixed(2)+" Gold!"):("Ты получил "+d.reward.name);$("mod").classList.remove("hidden");await load()},4900)};
async function catalog(){let d=await fetch(API+"/api/catalog").then(r=>r.json());$("ccount").textContent=d.item_count.toLocaleString("ru-RU")+" предметов";$("catalog").innerHTML=d.items.slice(0,500).map(x=>'<div class="cat"><img src="'+x.image+'"><div class="name">'+x.display_name+'</div><div class="rar">'+x.category+' · '+x.rarity+'</div></div>').join("")}
$("q").oninput=async e=>{let q=e.target.value.toLowerCase();document.querySelectorAll(".cat").forEach(x=>x.style.display=x.querySelector(".name").textContent.toLowerCase().includes(q)?"":"none")};$("nup").onclick=()=>{$("up").classList.remove("hidden");$("catpage").classList.add("hidden");$("nup").classList.add("on");$("ncat").classList.remove("on")};$("ncat").onclick=()=>{$("up").classList.add("hidden");$("catpage").classList.remove("hidden");$("nup").classList.remove("on");$("ncat").classList.add("on");catalog()};load().catch(()=>{});
</script></body></html>
